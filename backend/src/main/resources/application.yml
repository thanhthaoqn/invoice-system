server:
  port: 8088
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: smart-expense-reimbursement
  datasource:
    url: jdbc:postgresql://localhost:5432/expense_audit
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

app:
  gmail:
    enabled: ${GMAIL_INTEGRATION_ENABLED:false}
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:}
    token-encryption-key: ${GMAIL_TOKEN_ENCRYPTION_KEY:}
    label-name: ${GMAIL_LABEL_NAME:HOA_DON}
    sync-interval-ms: ${GMAIL_SYNC_INTERVAL_MS:300000}
    page-size: ${GMAIL_SYNC_PAGE_SIZE:100}
    max-retry-attempts: ${GMAIL_MAX_RETRY_ATTEMPTS:3}
    frontend-result-url: ${GMAIL_FRONTEND_RESULT_URL:http://127.0.0.1:5173/?gmail=}
  intake:
    max-files: 20
    max-file-bytes: 15728640
    max-batch-bytes: 25165824
    max-entries: 200
    max-expanded-bytes: 52428800
    max-compression-ratio: 100
    max-attempts: 3
    max-pdf-pages: 20
  ai-service:
    url: http://127.0.0.1:8000/api/extract
  storage:
    upload-dir: uploads/invoices
